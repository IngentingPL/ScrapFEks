name: Test Gemini API Key

# Odpal ręcznie: GitHub → Actions → Test Gemini API Key → Run workflow
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python newsletter.py
