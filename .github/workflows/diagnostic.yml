name: Squad Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: Run diagnostic
        env:
          FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
          FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
        run: python diagnose_squad.py
