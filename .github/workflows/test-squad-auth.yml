name: Test Squad Auth (tymczasowy)

on:
  workflow_dispatch: {}

jobs:
  test-squad-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests curl_cffi
      - name: Test squad auth
        env:
          FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
          FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
        run: python test_squad_auth.py
