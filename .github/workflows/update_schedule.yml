name: Update Schedule

on:
  push:
    paths:
      - 'terminarz.txt'
  workflow_dispatch:

# Tylko jeden workflow na raz może pisać do repo -
# zapobiega konfliktom przy nakładających się runach (dni meczowe)
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate schedule from terminarz.txt
        run: python update_schedule.py

      - name: Commit updated workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/scrape.yml
          if git diff --staged --quiet; then
            echo "No schedule changes"
          else
            git commit -m "⏰ Aktualizacja harmonogramu z terminarz.txt"
            git push https://x-access-token:${{ secrets.WORKFLOW_PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi
