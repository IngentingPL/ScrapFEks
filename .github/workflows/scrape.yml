name: Fantasy Ekstraklasa Scraper

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Maksymalna liczba zawodników'
        required: false
        default: '4000'
      target_round:
        description: 'Numer kolejki (puste = ostatnia)'
        required: false
        default: ''
      teams_to_scrape:
        description: 'Ile drużyn z rankingu scrapować (kapitanowie/ownership)'
        required: false
        default: '1000'
      league_slug:
        description: 'Slug ligi prywatnej (puste = pomiń)'
        required: false
        default: 'discord-fmforumcmf'
      league_id:
        description: 'ID ligi (z Network tab)'
        required: false
        default: '304'
      workers:
        description: 'Liczba równoległych workerów'
        required: false
        default: '10'
      max_runtime:
        description: 'Maksymalny czas pracy (minuty)'
        required: false
        default: '300'

  # AUTO-SCHEDULE-START
  schedule:
    - cron: '0 18 16 4 *'  # K29 DISCORD PRE 16.04 20:00 CEST — prognoza przed kolejką
    - cron: '30 16 17 4 *'  # K29 START 17.04 mecz 18:00 CEST → +30min 18:30 CEST
    - cron: '0 17 17 4 *'  # K29 DISCORD CAPTAINS 17.04 19:00 CEST — podsumowanie kapitanów
    - cron: '30 18 17 4 *'  # K29 17.04 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 17 4 *'  # K29 17.04 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 18 4 *'  # K29 18.04 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 18 4 *'  # K29 18.04 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 18 4 *'  # K29 18.04 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '45 12 19 4 *'  # K29 19.04 mecz 12:15 CEST → +2.5h 14:45 CEST
    - cron: '15 15 19 4 *'  # K29 19.04 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 19 4 *'  # K29 19.04 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '30 19 20 4 *'  # K29 20.04 mecz 19:00 CEST → +2.5h 21:30 CEST
    - cron: '0 10 21 4 *'  # K29 DISCORD POST 21.04 12:00 CEST — podsumowanie po kolejce
    - cron: '0 18 23 4 *'  # K30 DISCORD PRE 23.04 20:00 CEST — prognoza przed kolejką
    - cron: '30 16 24 4 *'  # K30 START 24.04 mecz 18:00 CEST → +30min 18:30 CEST
    - cron: '0 17 24 4 *'  # K30 DISCORD CAPTAINS 24.04 19:00 CEST — podsumowanie kapitanów
    - cron: '30 18 24 4 *'  # K30 24.04 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 24 4 *'  # K30 24.04 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 25 4 *'  # K30 25.04 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 25 4 *'  # K30 25.04 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 25 4 *'  # K30 25.04 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '45 12 26 4 *'  # K30 26.04 mecz 12:15 CEST → +2.5h 14:45 CEST
    - cron: '15 15 26 4 *'  # K30 26.04 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 26 4 *'  # K30 26.04 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '30 19 27 4 *'  # K30 27.04 mecz 19:00 CEST → +2.5h 21:30 CEST
    - cron: '0 10 28 4 *'  # K30 DISCORD POST 28.04 12:00 CEST — podsumowanie po kolejce
    - cron: '0 18 30 4 *'  # K31 DISCORD PRE 30.04 20:00 CEST — prognoza przed kolejką
    - cron: '0 16 1 5 *'  # K31 START 01.05 mecz 17:30 CEST → +30min 18:00 CEST
    - cron: '30 16 1 5 *'  # K31 DISCORD CAPTAINS 01.05 18:30 CEST — podsumowanie kapitanów
    - cron: '0 18 1 5 *'  # K31 01.05 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '0 21 1 5 *'  # K31 01.05 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '45 20 2 5 *'  # K31 02.05 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '45 12 3 5 *'  # K31 03.05 mecz 12:15 CEST → +2.5h 14:45 CEST
    - cron: '15 15 3 5 *'  # K31 03.05 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 3 5 *'  # K31 03.05 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '30 19 4 5 *'  # K31 04.05 mecz 19:00 CEST → +2.5h 21:30 CEST
    - cron: '0 18 7 5 *'  # K32 DISCORD PRE 07.05 20:00 CEST — prognoza przed kolejką
    - cron: '30 16 8 5 *'  # K32 START 08.05 mecz 18:00 CEST → +30min 18:30 CEST
    - cron: '0 17 8 5 *'  # K32 DISCORD CAPTAINS 08.05 19:00 CEST — podsumowanie kapitanów
    - cron: '30 18 8 5 *'  # K32 08.05 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 8 5 *'  # K32 08.05 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 9 5 *'  # K32 09.05 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 9 5 *'  # K32 09.05 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 9 5 *'  # K32 09.05 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '45 12 10 5 *'  # K32 10.05 mecz 12:15 CEST → +2.5h 14:45 CEST
    - cron: '15 15 10 5 *'  # K32 10.05 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 10 5 *'  # K32 10.05 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '30 19 11 5 *'  # K32 11.05 mecz 19:00 CEST → +2.5h 21:30 CEST
    - cron: '0 10 12 5 *'  # K32 DISCORD POST 12.05 12:00 CEST — podsumowanie po kolejce
    - cron: '30 18 13 5 *'  # K31 13.05 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 13 5 *'  # K31 13.05 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '0 10 14 5 *'  # K31 DISCORD POST 14.05 12:00 CEST — podsumowanie po kolejce
  # AUTO-SCHEDULE-END

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
          FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
          MAX_PLAYER_ID: ${{ github.event.inputs.max_players || '4000' }}
          TARGET_ROUND: ${{ github.event.inputs.target_round || '' }}
          TEAMS_TO_SCRAPE: ${{ github.event.inputs.teams_to_scrape || '1000' }}
          LEAGUE_SLUG: ${{ github.event.inputs.league_slug || 'discord-fmforumcmf' }}
          LEAGUE_ID: ${{ github.event.inputs.league_id || '304' }}
          WORKERS: ${{ github.event.inputs.workers || '10' }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime || '300' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-data-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes to avoid push conflicts
          git pull --rebase origin main
          
          mkdir -p docs
          cp output/dashboard.html docs/index.html
          
          git add output/ docs/ hockey_prev_ranking.json duets_prev_ranking.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Dane Fantasy Ekstraklasa - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Check if continuation needed
        id: check
        run: |
          NEEDED=${{ github.event.inputs.teams_to_scrape || '1000' }}
          DONE=0
          if [ -f output/checkpoint_global.json ]; then
            DONE=$(python3 -c "import json; print(len(json.load(open('output/checkpoint_global.json'))))")
          fi
          echo "needed=$NEEDED" >> $GITHUB_OUTPUT
          echo "done=$DONE" >> $GITHUB_OUTPUT
          if [ "$DONE" -lt "$NEEDED" ] && [ "$DONE" -gt "0" ]; then
            echo "continue=true" >> $GITHUB_OUTPUT
            echo "🔄 Checkpoint: $DONE/$NEEDED — kontynuacja potrzebna"
          else
            echo "continue=false" >> $GITHUB_OUTPUT
            echo "✅ Checkpoint: $DONE/$NEEDED — zakończono"
          fi

      - name: Auto-continue if incomplete
        if: steps.check.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Re-trigger workflow (${{ steps.check.outputs.done }}/${{ steps.check.outputs.needed }})..."
          gh workflow run scrape.yml \
            -f max_players="${{ github.event.inputs.max_players || '4000' }}" \
            -f target_round="${{ github.event.inputs.target_round || '' }}" \
            -f teams_to_scrape="${{ github.event.inputs.teams_to_scrape || '1000' }}" \
            -f league_slug="${{ github.event.inputs.league_slug || 'discord-fmforumcmf' }}" \
            -f league_id="${{ github.event.inputs.league_id || '304' }}" \
            -f workers="${{ github.event.inputs.workers || '10' }}" \
            -f max_runtime="${{ github.event.inputs.max_runtime || '300' }}"
