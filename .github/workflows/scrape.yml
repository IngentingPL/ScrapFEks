name: Fantasy Ekstraklasa Scraper

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Maksymalna liczba zawodników'
        required: false
        default: '4000'
      target_round:
        description: 'Numer kolejki (puste = ostatnia)'
        required: false
        default: ''
      teams_to_scrape:
        description: 'Ile drużyn z rankingu scrapować (kapitanowie/ownership)'
        required: false
        default: '1000'
      league_slug:
        description: 'Slug ligi prywatnej (puste = pomiń)'
        required: false
        default: 'fmforumdiscord-iii'
      league_id:
        description: 'ID ligi (z Network tab)'
        required: false
        default: '641'
      workers:
        description: 'Liczba równoległych workerów'
        required: false
        default: '10'
      max_runtime:
        description: 'Maksymalny czas pracy (minuty)'
        required: false
        default: '300'

  # AUTO-SCHEDULE-START
  schedule:
    - cron: '0 18 13 8 *'  # K4 DISCORD PRE 13.08 20:00 CEST — prognoza przed kolejką
    - cron: '0 19 14 8 *'  # K4 START 14.08 mecz 20:30 CEST → +30min 21:00 CEST
    - cron: '30 19 14 8 *'  # K4 DISCORD CAPTAINS 14.08 21:30 CEST — podsumowanie kapitanów
    - cron: '0 21 14 8 *'  # K4 14.08 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 15 8 *'  # K4 15.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 15 8 *'  # K4 15.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 15 8 *'  # K4 15.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '15 15 16 8 *'  # K4 16.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 16 8 *'  # K4 16.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 16 8 *'  # K4 16.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '0 10 17 8 *'  # K4 DISCORD POST 17.08 12:00 CEST — podsumowanie po kolejce
    - cron: '0 18 20 8 *'  # K5 DISCORD PRE 20.08 20:00 CEST — prognoza przed kolejką
    - cron: '0 19 21 8 *'  # K5 START 21.08 mecz 20:30 CEST → +30min 21:00 CEST
    - cron: '30 19 21 8 *'  # K5 DISCORD CAPTAINS 21.08 21:30 CEST — podsumowanie kapitanów
    - cron: '0 21 21 8 *'  # K5 21.08 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 22 8 *'  # K5 22.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 22 8 *'  # K5 22.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 22 8 *'  # K5 22.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '15 15 23 8 *'  # K5 23.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 23 8 *'  # K5 23.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 23 8 *'  # K5 23.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '0 10 24 8 *'  # K5 DISCORD POST 24.08 12:00 CEST — podsumowanie po kolejce
    - cron: '0 18 27 8 *'  # K6 DISCORD PRE 27.08 20:00 CEST — prognoza przed kolejką
    - cron: '30 16 28 8 *'  # K6 START 28.08 mecz 18:00 CEST → +30min 18:30 CEST
    - cron: '0 17 28 8 *'  # K6 DISCORD CAPTAINS 28.08 19:00 CEST — podsumowanie kapitanów
    - cron: '30 18 28 8 *'  # K6 28.08 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 28 8 *'  # K6 28.08 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '45 12 29 8 *'  # K6 29.08 mecz 12:15 CEST → +2.5h 14:45 CEST
    - cron: '15 15 29 8 *'  # K6 29.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 29 8 *'  # K6 29.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 29 8 *'  # K6 29.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '15 15 30 8 *'  # K6 30.08 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 30 8 *'  # K6 30.08 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 30 8 *'  # K6 30.08 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '0 10 31 8 *'  # K6 DISCORD POST 31.08 12:00 CEST — podsumowanie po kolejce
    - cron: '0 18 3 9 *'  # K7 DISCORD PRE 03.09 20:00 CEST — prognoza przed kolejką
    - cron: '0 19 4 9 *'  # K7 START 04.09 mecz 20:30 CEST → +30min 21:00 CEST
    - cron: '30 19 4 9 *'  # K7 DISCORD CAPTAINS 04.09 21:30 CEST — podsumowanie kapitanów
    - cron: '0 21 4 9 *'  # K7 04.09 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '15 15 5 9 *'  # K7 05.09 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 5 9 *'  # K7 05.09 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 5 9 *'  # K7 05.09 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '15 15 6 9 *'  # K7 06.09 mecz 14:45 CEST → +2.5h 17:15 CEST
    - cron: '0 18 6 9 *'  # K7 06.09 mecz 17:30 CEST → +2.5h 20:00 CEST
    - cron: '45 20 6 9 *'  # K7 06.09 mecz 20:15 CEST → +2.5h 22:45 CEST
    - cron: '30 18 7 9 *'  # K7 07.09 mecz 18:00 CEST → +2.5h 20:30 CEST
    - cron: '0 21 7 9 *'  # K7 07.09 mecz 20:30 CEST → +2.5h 23:00 CEST
    - cron: '0 10 8 9 *'  # K7 DISCORD POST 08.09 12:00 CEST — podsumowanie po kolejce
  # AUTO-SCHEDULE-END

# Tylko jeden workflow na raz może pisać do repo -
# zapobiega konfliktom przy nakładających się runach (dni meczowe)
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies  # Przyspiesza instalację zależności (~30-60s)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          FANTASY_EMAIL: ${{ secrets.FANTASY_EMAIL }}
          FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}
          MAX_PLAYER_ID: ${{ github.event.inputs.max_players || '4000' }}
          TARGET_ROUND: ${{ github.event.inputs.target_round || '' }}
          TEAMS_TO_SCRAPE: ${{ github.event.inputs.teams_to_scrape || '1000' }}
          LEAGUE_SLUG: ${{ github.event.inputs.league_slug || 'fmforumdiscord-iii' }}
          LEAGUE_ID: ${{ github.event.inputs.league_id || '641' }}
          WORKERS: ${{ github.event.inputs.workers || '10' }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime || '300' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXTRAKLASA_API_TOKEN: ${{ secrets.EXTRAKLASA_API_TOKEN }}
        run: python scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-data-${{ github.run_number }}
          path: output/
          retention-days: 7  # Artefakt tylko do debugowania ostatniego runu; dane i tak są w repo

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stash wszystkiego co wygenerował scraper przed rebase
          git add -A
          git stash --include-untracked
          
          # Pull latest changes
          git fetch origin
          if ! git rebase origin/main; then
            echo "❌ Rebase nie powiódł się - przerywam, żeby nie zepsuć repo"
            git rebase --abort
            exit 1
          fi
          
          # Przywróć wygenerowane pliki
          if ! git stash pop; then
            echo "❌ Stash pop ma konflikty - przerywam, żeby nie zepsuć dashboardu"
            git reset --hard HEAD
            exit 1
          fi
          
          mkdir -p docs
          cp output/dashboard.html docs/index.html
          
          # Dodaj wszystko (w tym nowe pliki po stash pop)
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Dane Fantasy Ekstraklasa - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Check if continuation needed
        id: check
        run: |
          NEEDED=${{ github.event.inputs.teams_to_scrape || '1000' }}
          DONE=0
          if [ -f output/checkpoint_global.json ]; then
            DONE=$(python3 -c "import json; print(len(json.load(open('output/checkpoint_global.json'))))")
          fi
          echo "needed=$NEEDED" >> $GITHUB_OUTPUT
          echo "done=$DONE" >> $GITHUB_OUTPUT
          if [ "$DONE" -lt "$NEEDED" ] && [ "$DONE" -gt "0" ]; then
            echo "continue=true" >> $GITHUB_OUTPUT
            echo "🔄 Checkpoint: $DONE/$NEEDED — kontynuacja potrzebna"
          else
            echo "continue=false" >> $GITHUB_OUTPUT
            echo "✅ Checkpoint: $DONE/$NEEDED — zakończono"
          fi

      - name: Auto-continue if incomplete
        if: steps.check.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔄 Re-trigger workflow (${{ steps.check.outputs.done }}/${{ steps.check.outputs.needed }})..."
          gh workflow run scrape.yml \
            -f max_players="${{ github.event.inputs.max_players || '4000' }}" \
            -f target_round="${{ github.event.inputs.target_round || '' }}" \
            -f teams_to_scrape="${{ github.event.inputs.teams_to_scrape || '1000' }}" \
            -f league_slug="${{ github.event.inputs.league_slug || 'fmforumdiscord-iii' }}" \
            -f league_id="${{ github.event.inputs.league_id || '641' }}" \
            -f workers="${{ github.event.inputs.workers || '10' }}" \
            -f max_runtime="${{ github.event.inputs.max_runtime || '300' }}"
