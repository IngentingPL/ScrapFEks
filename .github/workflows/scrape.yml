name: Fantasy Ekstraklasa Scraper

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Maksymalna liczba zawodników'
        required: false
        default: '100'
      target_round:
        description: 'Numer kolejki (puste = ostatnia)'
        required: false
        default: ''
      teams_to_scrape:
        description: 'Ile drużyn z rankingu scrapować (kapitanowie/ownership)'
        required: false
        default: '100'
      league_slug:
        description: 'Slug ligi prywatnej (puste = pomiń)'
        required: false
        default: 'discord-fmforumcmf'
      league_id:
        description: 'ID ligi (z Network tab)'
        required: false
        default: '304'
      workers:
        description: 'Liczba równoległych workerów'
        required: false
        default: '10'
      max_runtime:
        description: 'Maksymalny czas pracy (minuty)'
        required: false
        default: '300'

  # schedule:
  #   - cron: '0 20 * * 5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

